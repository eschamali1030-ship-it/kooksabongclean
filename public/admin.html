<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 페이지</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>관리자 페이지</h1>
      <p>예약 현황과 관리자 청소 배정을 관리할 수 있습니다.</p>
    </header>

    <section class="today-card">
      <h2>관리자 로그인</h2>
      <input type="password" id="adminPassword" placeholder="관리자 비밀번호 입력" />
      <button onclick="adminLogin()" class="primary-btn">로그인</button>
      <p id="loginMessage" style="margin-top:10px;"></p>
    </section>

    <section id="adminPanel" class="hidden">
      <div class="top-bar">
        <div>
          <span class="badge">관리자 모드</span>
          <span class="user-info">청소 일정 관리 중</span>
        </div>
        <a href="index.html"><button class="secondary-btn">메인으로 돌아가기</button></a>
      </div>

      <section class="entry-box">
        <h3>관리자 청소 배정</h3>
        <p>학생을 선택한 뒤, 아래 달력에서 여러 날짜를 클릭하고 저장하세요.</p>

        <label for="assignStudentSelect">학생 선택</label>
        <select id="assignStudentSelect"></select>

        <div class="calendar-controls">
          <button type="button" onclick="changeMonth(-1)">◀</button>
          <h2 id="assignMonthTitle"></h2>
          <button type="button" onclick="changeMonth(1)">▶</button>
        </div>

        <div class="legend">
          <span><span class="dot available"></span> 선택 가능</span>
          <span><span class="dot partial"></span> 선택됨</span>
          <span><span class="dot holiday"></span> 주말/공휴일</span>
        </div>

        <div id="assignCalendar" class="calendar"></div>

        <div class="selected-info">
          <h3>선택한 날짜</h3>
          <div id="selectedAssignDates">선택한 날짜가 없습니다.</div>
        </div>

        <button onclick="saveAssignments()" class="primary-btn" style="margin-top:10px;">
          선택한 날짜에 학생 배정 저장
        </button>
      </section>

      <section class="entry-box">
        <h3>앞으로의 관리자 배정 목록</h3>
        <div id="assignmentList"></div>
      </section>

      <section class="entry-box">
        <h3>앞으로의 예약 현황</h3>
        <div id="adminReservationList"></div>
      </section>

      <section class="entry-box">
        <h3>관리 기능</h3>
        <button onclick="resetAll()" class="back-btn">전체 예약 초기화</button>
        <button onclick="downloadMonthlyExcel()" class="primary-btn" style="margin-top:10px;">
          월별 예약표 CSV 다운로드
        </button>
        <button onclick="resetStudents()" class="secondary-btn" style="margin-top:10px;">
          학생 목록 새 이름으로 초기화
        </button>
      </section>
    </section>
  </div>

  <script>
    let adminPassword = "";
    let assignCurrentDate = new Date();
    let selectedAssignDates = new Set();
    let assignmentData = {};

    async function adminLogin() {
      const password = document.getElementById("adminPassword").value;
      const loginMessage = document.getElementById("loginMessage");

      const res = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });

      const data = await res.json();

      if (!res.ok) {
        loginMessage.textContent = data.message;
        loginMessage.style.color = "yellow";
        return;
      }

      adminPassword = password;
      loginMessage.textContent = "로그인 성공";
      loginMessage.style.color = "white";
      document.getElementById("adminPanel").classList.remove("hidden");

      await loadAssignments();
      await loadAllReservations();
      renderAssignCalendar();
    }

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function changeMonth(diff) {
      assignCurrentDate.setMonth(assignCurrentDate.getMonth() + diff);
      renderAssignCalendar();
    }

    async function loadAssignments() {
      const res = await fetch("/api/admin/assignments");
      const data = await res.json();

      const studentSelect = document.getElementById("assignStudentSelect");
      studentSelect.innerHTML =
        `<option value="">학생 선택</option>` +
        data.students.map(name => `<option value="${name}">${name}</option>`).join("");

      assignmentData = data.assignments || {};
      renderAssignmentList();
    }

    function renderAssignmentList() {
      const box = document.getElementById("assignmentList");
      const dates = Object.keys(assignmentData).sort();

      if (!dates.length) {
        box.innerHTML = "<p>앞으로의 관리자 배정이 없습니다.</p>";
        return;
      }

      box.innerHTML = dates.map(date => `
        <div class="reservation-card">
          <div>
            <strong>${date}</strong><br/>
            관리자 배정: ${assignmentData[date].join(", ")}
          </div>
          <div class="reservation-actions">
            ${assignmentData[date].map(name => `
              <button class="back-btn" style="margin-top:6px;" onclick="deleteAssignment('${date}', '${name}')">
                ${name} 삭제
              </button>
            `).join("")}
          </div>
        </div>
      `).join("");
    }

    async function renderAssignCalendar() {
      const year = assignCurrentDate.getFullYear();
      const month = assignCurrentDate.getMonth() + 1;

      document.getElementById("assignMonthTitle").textContent = `${year}년 ${month}월`;

      const res = await fetch(`/api/reservations?year=${year}&month=${month}`);
      const data = await res.json();
      const holidays = data.holidays || {};

      const calendar = document.getElementById("assignCalendar");
      calendar.innerHTML = "";

      const days = ["일", "월", "화", "수", "목", "금", "토"];
      days.forEach(day => {
        const header = document.createElement("div");
        header.className = "day-header";
        header.textContent = day;
        calendar.appendChild(header);
      });

      const firstDay = new Date(year, month - 1, 1);
      const lastDate = new Date(year, month, 0).getDate();
      const startDay = firstDay.getDay();

      for (let i = 0; i < startDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day-cell empty-cell";
        calendar.appendChild(empty);
      }

      for (let day = 1; day <= lastDate; day++) {
        const dateObj = new Date(year, month - 1, day);
        const dateStr = formatDate(dateObj);
        const dayOfWeek = dateObj.getDay();
        const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
        const isHoliday = Boolean(holidays[dateStr]);
        const isBlocked = isWeekend || isHoliday;
        const isSelected = selectedAssignDates.has(dateStr);

        const cell = document.createElement("div");
        cell.classList.add("day-cell");

        if (isBlocked) {
          cell.classList.add("holiday-cell");
        } else if (isSelected) {
          cell.classList.add("partial-cell");
        } else {
          cell.classList.add("available-cell");
        }

        cell.innerHTML = `
          <div class="day-number">${day}</div>
          <div class="day-status">${isBlocked ? (holidays[dateStr] || "주말") : (isSelected ? "선택됨" : "선택 가능")}</div>
        `;

        if (!isBlocked) {
          cell.addEventListener("click", () => {
            if (selectedAssignDates.has(dateStr)) {
              selectedAssignDates.delete(dateStr);
            } else {
              selectedAssignDates.add(dateStr);
            }
            updateSelectedAssignDates();
            renderAssignCalendar();
          });
        }

        calendar.appendChild(cell);
      }
    }

    function updateSelectedAssignDates() {
      const box = document.getElementById("selectedAssignDates");
      const dates = Array.from(selectedAssignDates).sort();

      if (!dates.length) {
        box.textContent = "선택한 날짜가 없습니다.";
        return;
      }

      box.innerHTML = dates.map(date => `<div>${date}</div>`).join("");
    }

    async function saveAssignments() {
      const student = document.getElementById("assignStudentSelect").value;
      const dates = Array.from(selectedAssignDates).sort();

      if (!student) {
        alert("학생을 선택해주세요.");
        return;
      }

      if (!dates.length) {
        alert("날짜를 하나 이상 선택해주세요.");
        return;
      }

      const res = await fetch("/api/admin/assignments", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          password: adminPassword,
          name: student,
          dates
        })
      });

      const data = await res.json();
      alert(data.message);

      selectedAssignDates.clear();
      updateSelectedAssignDates();
      await loadAssignments();
      renderAssignCalendar();
    }

    async function deleteAssignment(date, name) {
      if (!confirm(`${date}의 ${name} 관리자 배정을 삭제할까요?`)) return;

      const res = await fetch("/api/admin/assignments/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          password: adminPassword,
          date,
          name
        })
      });

      const data = await res.json();
      alert(data.message);
      await loadAssignments();
    }

    async function loadAllReservations() {
      const res = await fetch("/api/admin/all");
      const data = await res.json();

      const box = document.getElementById("adminReservationList");
      const reservations = data.reservations;
      const dates = Object.keys(reservations).sort();

      if (!dates.length) {
        box.innerHTML = "<p>앞으로의 예약이 없습니다.</p>";
        return;
      }

box.innerHTML = dates.map(date => `
  <div class="reservation-card">
    <div>
      <strong>${date}</strong><br/>
      예약자: ${reservations[date].join(", ")}
    </div>
    <div class="reservation-actions">
      ${reservations[date].map(name => `
        <button class="back-btn" style="margin-top:6px;" onclick="deleteReservation('${date}', '${name}')">
          ${name} 삭제
        </button>
      `).join("")}
    </div>
  </div>
`).join("");
    }

async function deleteReservation(date, name) {
  if (!confirm(`${date}의 ${name} 예약을 삭제할까요?`)) return;

  const res = await fetch("/api/admin/delete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      password: adminPassword,
      date,
      name
    })
  });

  const data = await res.json();
  alert(data.message);
  loadAllReservations();
}

    async function resetAll() {
      if (!confirm("전체 예약을 초기화할까요?")) return;

      const res = await fetch("/api/admin/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: adminPassword })
      });

      const data = await res.json();
      alert(data.message);
      loadAllReservations();
    }

    async function resetStudents() {
      if (!confirm("학생 목록을 새 이름 목록으로 바꿀까요?")) return;

      const res = await fetch("/api/admin/reset-students", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: adminPassword })
      });

      const data = await res.json();
      alert(data.message);
      loadAssignments();
    }

    function downloadMonthlyExcel() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      window.location.href = `/api/admin/export-csv?year=${year}&month=${month}`;
    }
  </script>
</body>
</html>
