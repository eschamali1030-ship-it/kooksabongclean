<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>청소 예약 시스템</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>청소 예약 시스템</h1>
      <p>학년과 반을 선택한 뒤 반 접속 비밀번호를 입력하세요.</p>
    </header>

    <section class="today-card">
      <h2>금일 청소 담당</h2>
      <div id="todayInfo" class="today-info">반을 선택하면 오늘 청소 담당이 표시됩니다.</div>
    </section>

    <section id="entrySection" class="entry-section">
      <div class="entry-box">
        <h3>학급 선택</h3>

        <label for="gradeSelect">학년</label>
        <select id="gradeSelect"></select>

        <label for="classSelect">반</label>
        <select id="classSelect"></select>

        <label for="accessPasswordInput">반 접속 비밀번호</label>
        <input type="password" id="accessPasswordInput" placeholder="반 접속 비밀번호 입력" />

        <button id="verifyClassBtn" class="primary-btn">반 접속 확인</button>
      </div>

      <div class="entry-box hidden" id="modeBox">
        <h3>접속 모드 선택</h3>

        <div id="classInfoText" style="margin-bottom: 12px; font-weight: bold;"></div>

        <label for="studentSelect">학생 선택</label>
        <select id="studentSelect"></select>

        <button id="enterReserveBtn" class="primary-btn">예약 모드로 접속</button>
        <button id="enterViewBtn" class="secondary-btn" style="margin-top:10px;">조회 모드로 접속</button>
      </div>

      <div class="entry-box">
        <h3>관리자 페이지</h3>
        <p>반 관리자와 통합 관리자 페이지로 이동할 수 있습니다.</p>
        <a href="subadmin.html"><button class="secondary-btn">서브 관리자 페이지</button></a>
        <a href="superadmin.html"><button class="back-btn" style="margin-top:10px;">통합 관리자 페이지</button></a>
      </div>
    </section>

    <section id="appSection" class="hidden">
      <div class="top-bar">
        <div>
          <span id="modeBadge" class="badge"></span>
          <span id="userInfo" class="user-info"></span>
        </div>
        <button id="backBtn" class="back-btn">처음으로</button>
      </div>

      <div class="calendar-controls">
        <button id="prevMonthBtn">◀</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonthBtn">▶</button>
      </div>

      <div class="legend">
        <span><span class="dot available"></span> 예약 가능</span>
        <span><span class="dot partial"></span> 1명 예약</span>
        <span><span class="dot full"></span> 2명 마감</span>
        <span><span class="dot holiday"></span> 공휴일/주말</span>
      </div>

      <div id="calendar" class="calendar"></div>

      <section class="selected-info">
        <h3>선택한 날짜 정보</h3>
        <div id="selectedDateInfo">날짜를 선택하세요.</div>
      </section>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
