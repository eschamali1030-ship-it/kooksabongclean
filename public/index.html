<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>청소 날짜 예약 시스템</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>청소 날짜 예약 시스템</h1>
      <p>원하는 날짜를 선택하고 청소를 예약하세요.</p>
    </header>

    <section class="today-card">
      <h2>금일 청소 담당</h2>
      <div id="todayInfo" class="today-info">불러오는 중...</div>
    </section>

    <section id="entrySection" class="entry-section">
      <div class="entry-box">
        <h3>예약 모드</h3>
        <label for="studentSelect">학생 선택</label>
        <select id="studentSelect"></select>
        <button id="enterReserveBtn" class="primary-btn">예약 모드로 접속</button>
      </div>

      <div class="entry-box">
        <h3>조회 모드</h3>
        <p>예약은 하지 않고 상태만 확인합니다.</p>
        <button id="enterViewBtn" class="secondary-btn">조회 모드로 접속</button>
      </div>

      <div class="entry-box">
        <h3>관리자 페이지</h3>
        <p>예약 관리 및 초기화를 할 수 있습니다.</p>
        <a href="admin.html"><button class="back-btn">관리자 페이지로 이동</button></a>
      </div>
    </section>

    <section id="appSection" class="hidden">
      <div class="top-bar">
        <div>
          <span id="modeBadge" class="badge"></span>
          <span id="userInfo" class="user-info"></span>
        </div>
        <button id="backBtn" class="back-btn">처음으로</button>
      </div>

      <div class="calendar-controls">
        <button id="prevMonthBtn">◀</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonthBtn">▶</button>
      </div>

      <div class="legend">
        <span><span class="dot available"></span> 예약 가능</span>
        <span><span class="dot partial"></span> 1명 예약</span>
        <span><span class="dot full"></span> 2명 마감</span>
        <span><span class="dot holiday"></span> 공휴일/주말</span>
      </div>

      <div id="calendar" class="calendar"></div>

      <section class="selected-info">
        <h3>선택한 날짜 정보</h3>
        <div id="selectedDateInfo">날짜를 선택하세요.</div>
      </section>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
