<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서브 관리자 페이지</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>서브 관리자 페이지</h1>
      <p>자기 반 학생 명렬표, 반 접속 비밀번호, 최대 예약 인원, 예약 및 관리자 배정을 관리합니다.</p>
    </header>

    <section class="today-card">
      <h2>서브 관리자 로그인</h2>

      <label for="subGradeSelect">학년</label>
      <select id="subGradeSelect"></select>

      <label for="subClassSelect">반</label>
      <select id="subClassSelect"></select>

      <label for="subAdminPasswordInput">서브 관리자 비밀번호</label>
      <input type="password" id="subAdminPasswordInput" placeholder="서브 관리자 비밀번호 입력" />

      <button id="subLoginBtn" class="primary-btn">로그인</button>
      <p id="subLoginMessage" style="margin-top:10px;"></p>
    </section>

    <section id="subAdminPanel" class="hidden">
      <div class="top-bar">
        <div>
          <span class="badge">서브 관리자 모드</span>
          <span id="subAdminClassInfo" class="user-info"></span>
        </div>
        <a href="index.html"><button class="secondary-btn">메인으로 돌아가기</button></a>
      </div>

      <section class="entry-box">
        <h3>반 접속 비밀번호 설정</h3>
        <label for="classAccessPasswordInput">학생/조회자용 반 접속 비밀번호</label>
        <input type="text" id="classAccessPasswordInput" placeholder="반 접속 비밀번호 입력" />
        <button id="saveAccessPasswordBtn" class="primary-btn">반 접속 비밀번호 저장</button>
      </section>

      <section class="entry-box">
        <h3>최대 예약 인원 설정</h3>
        <label for="maxReservationsInput">하루 최대 예약 가능 인원수</label>
        <input type="number" id="maxReservationsInput" min="1" placeholder="예: 2" />
        <button id="saveMaxReservationsBtn" class="primary-btn">최대 예약 인원 저장</button>
      </section>

      <section class="entry-box">
        <h3>학생 명렬표 관리</h3>
        <p>한 줄에 한 명씩 입력하세요.</p>
        <textarea id="studentListTextarea" class="big-textarea" placeholder="예시&#10;김민준&#10;이서연&#10;박지후"></textarea>
        <button id="saveStudentListBtn" class="primary-btn">학생 명렬표 저장</button>
      </section>

      <section class="entry-box">
        <h3>관리자 날짜별 청소 배정</h3>
        <p>학생을 선택한 뒤 아래 달력에서 날짜를 여러 개 클릭하고 저장하세요.</p>

        <label for="assignStudentSelect">학생 선택</label>
        <select id="assignStudentSelect"></select>

        <div class="calendar-controls">
          <button type="button" id="assignPrevMonthBtn">◀</button>
          <h2 id="assignMonthTitle"></h2>
          <button type="button" id="assignNextMonthBtn">▶</button>
        </div>

        <div class="legend">
          <span><span class="dot available"></span> 선택 가능</span>
          <span><span class="dot partial"></span> 선택됨</span>
          <span><span class="dot holiday"></span> 주말/공휴일</span>
        </div>

        <div id="assignCalendar" class="calendar"></div>

        <section class="selected-info">
          <h3>선택한 날짜</h3>
          <div id="selectedAssignDates">선택한 날짜가 없습니다.</div>
        </section>

        <button id="saveAssignmentsBtn" class="primary-btn">선택한 날짜에 학생 배정 저장</button>
      </section>

      <section class="entry-box">
        <h3>앞으로의 관리자 배정 목록</h3>
        <div id="assignmentList"></div>
      </section>

      <section class="entry-box">
        <h3>앞으로의 예약 현황</h3>
        <div id="reservationList"></div>
      </section>
    </section>
  </div>

  <script>
    let allClasses = [];
    let selectedGrade = null;
    let selectedClassNo = null;
    let subAdminPassword = "";
    let assignCurrentDate = new Date();
    let selectedAssignDates = new Set();
    let currentStudents = [];
    let currentAssignments = {};
    let currentReservations = {};

    const subGradeSelect = document.getElementById("subGradeSelect");
    const subClassSelect = document.getElementById("subClassSelect");
    const subAdminPasswordInput = document.getElementById("subAdminPasswordInput");
    const subLoginBtn = document.getElementById("subLoginBtn");
    const subLoginMessage = document.getElementById("subLoginMessage");
    const subAdminPanel = document.getElementById("subAdminPanel");
    const subAdminClassInfo = document.getElementById("subAdminClassInfo");

    const classAccessPasswordInput = document.getElementById("classAccessPasswordInput");
    const saveAccessPasswordBtn = document.getElementById("saveAccessPasswordBtn");

    const maxReservationsInput = document.getElementById("maxReservationsInput");
    const saveMaxReservationsBtn = document.getElementById("saveMaxReservationsBtn");

    const studentListTextarea = document.getElementById("studentListTextarea");
    const saveStudentListBtn = document.getElementById("saveStudentListBtn");

    const assignStudentSelect = document.getElementById("assignStudentSelect");
    const assignMonthTitle = document.getElementById("assignMonthTitle");
    const assignCalendar = document.getElementById("assignCalendar");
    const selectedAssignDatesBox = document.getElementById("selectedAssignDates");
    const saveAssignmentsBtn = document.getElementById("saveAssignmentsBtn");

    const assignmentList = document.getElementById("assignmentList");
    const reservationList = document.getElementById("reservationList");

    document.getElementById("assignPrevMonthBtn").addEventListener("click", () => {
      assignCurrentDate.setMonth(assignCurrentDate.getMonth() - 1);
      renderAssignCalendar();
    });

    document.getElementById("assignNextMonthBtn").addEventListener("click", () => {
      assignCurrentDate.setMonth(assignCurrentDate.getMonth() + 1);
      renderAssignCalendar();
    });

    subGradeSelect.addEventListener("change", () => {
      renderClassOptions();
    });

    subLoginBtn.addEventListener("click", async () => {
      try {
        selectedGrade = Number(subGradeSelect.value);
        selectedClassNo = Number(subClassSelect.value);
        subAdminPassword = subAdminPasswordInput.value;

        if (!selectedGrade || !selectedClassNo) {
          alert("학년과 반을 선택해주세요.");
          return;
        }

        const res = await fetch("/api/subadmin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            grade: selectedGrade,
            classNo: selectedClassNo,
            password: subAdminPassword
          })
        });

        const data = await res.json();

        if (!res.ok) {
          subLoginMessage.textContent = data.message || "로그인 실패";
          subLoginMessage.style.color = "yellow";
          return;
        }

        subLoginMessage.textContent = "로그인 성공";
        subLoginMessage.style.color = "white";
        subAdminPanel.classList.remove("hidden");
        subAdminClassInfo.textContent = `${selectedGrade}학년 ${selectedClassNo}반 관리 중`;

        await loadDashboard();
        await renderAssignCalendar();
      } catch (error) {
        alert("로그인 처리 중 오류가 발생했습니다.\n\n상세: " + error.message);
      }
    });

    saveAccessPasswordBtn.addEventListener("click", async () => {
      const accessPassword = classAccessPasswordInput.value;

      const res = await fetch("/api/subadmin/access-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          grade: selectedGrade,
          classNo: selectedClassNo,
          password: subAdminPassword,
          accessPassword
        })
      });

      const data = await res.json();
      alert(data.message);
    });

    saveMaxReservationsBtn.addEventListener("click", async () => {
      const maxReservations = Number(maxReservationsInput.value);

      const res = await fetch("/api/subadmin/max-reservations", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          grade: selectedGrade,
          classNo: selectedClassNo,
          password: subAdminPassword,
          maxReservations
        })
      });

      const data = await res.json();
      alert(data.message);

      if (res.ok) {
        await loadDashboard();
      }
    });

    saveStudentListBtn.addEventListener("click", async () => {
      const names = studentListTextarea.value
        .split("\n")
        .map(name => name.trim())
        .filter(Boolean);

      const res = await fetch("/api/subadmin/students", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          grade: selectedGrade,
          classNo: selectedClassNo,
          password: subAdminPassword,
          names
        })
      });

      const data = await res.json();
      alert(data.message);

      if (res.ok) {
        await loadDashboard();
        await renderAssignCalendar();
      }
    });

    saveAssignmentsBtn.addEventListener("click", async () => {
      const name = assignStudentSelect.value;
      const dates = Array.from(selectedAssignDates).sort();

      if (!name) {
        alert("학생을 선택해주세요.");
        return;
      }

      if (!dates.length) {
        alert("날짜를 하나 이상 선택해주세요.");
        return;
      }

      const res = await fetch("/api/subadmin/assignments", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          grade: selectedGrade,
          classNo: selectedClassNo,
          password: subAdminPassword,
          name,
          dates
        })
      });

      const data = await res.json();
      alert(data.message);

      if (res.ok) {
        selectedAssignDates.clear();
        updateSelectedAssignDates();
        await loadDashboard();
        await renderAssignCalendar();
      }
    });

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    async function loadClasses() {
      try {
        const res = await fetch("/api/classes");
        const data = await res.json();

        allClasses = data.classes || [];

        const grades = [...new Set(allClasses.map(item => item.grade))].sort((a, b) => a - b);

        subGradeSelect.innerHTML =
          `<option value="">학년 선택</option>` +
          grades.map(grade => `<option value="${grade}">${grade}학년</option>`).join("");

        subClassSelect.innerHTML = `<option value="">반 선택</option>`;
      } catch (error) {
        alert("학급 목록 불러오기 실패\n\n상세: " + error.message);
      }
    }

    function renderClassOptions() {
      const grade = Number(subGradeSelect.value);

      if (!grade) {
        subClassSelect.innerHTML = `<option value="">반 선택</option>`;
        return;
      }

      const classes = allClasses
        .filter(item => item.grade === grade)
        .map(item => item.class_no)
        .sort((a, b) => a - b);

      subClassSelect.innerHTML =
        `<option value="">반 선택</option>` +
        classes.map(classNo => `<option value="${classNo}">${classNo}반</option>`).join("");
    }

    async function loadDashboard() {
      try {
        const res = await fetch(`/api/subadmin/dashboard?grade=${selectedGrade}&classNo=${selectedClassNo}`);
        const data = await res.json();

        if (!res.ok) {
          alert((data.message || "대시보드 불러오기 실패") + (data.detail ? "\n\n상세: " + data.detail : ""));
          return;
        }

        currentStudents = data.students || [];
        currentAssignments = data.assignments || {};
        currentReservations = data.reservations || {};

        classAccessPasswordInput.value = data.classInfo.accessPassword || "";
        maxReservationsInput.value = data.classInfo.maxReservations || 2;
        studentListTextarea.value = currentStudents.join("\n");

        assignStudentSelect.innerHTML =
          `<option value="">학생 선택</option>` +
          currentStudents.map(name => `<option value="${name}">${name}</option>`).join("");

        renderAssignmentList();
        renderReservationList();
      } catch (error) {
        alert("대시보드 불러오기 중 브라우저 오류가 발생했습니다.\n\n상세: " + error.message);
      }
    }

    function renderAssignmentList() {
      const dates = Object.keys(currentAssignments).sort();

      if (!dates.length) {
        assignmentList.innerHTML = "<p>앞으로의 관리자 배정이 없습니다.</p>";
        return;
      }

      assignmentList.innerHTML = dates.map(date => `
        <div class="reservation-card">
          <div>
            <strong>${date}</strong><br/>
            관리자 배정: ${currentAssignments[date].join(", ")}
          </div>
          <div class="reservation-actions">
            ${currentAssignments[date].map(name => `
              <button class="small-delete-btn" onclick="deleteAssignment('${date}', '${name}')">${name} 삭제</button>
            `).join("")}
          </div>
        </div>
      `).join("");
    }

    function renderReservationList() {
      const dates = Object.keys(currentReservations).sort();

      if (!dates.length) {
        reservationList.innerHTML = "<p>앞으로의 예약이 없습니다.</p>";
        return;
      }

      reservationList.innerHTML = dates.map(date => `
        <div class="reservation-card">
          <div>
            <strong>${date}</strong><br/>
            예약자: ${currentReservations[date].join(", ")}
          </div>
          <div class="reservation-actions">
            ${currentReservations[date].map(name => `
              <button class="small-delete-btn" onclick="deleteReservation('${date}', '${name}')">${name} 삭제</button>
            `).join("")}
          </div>
        </div>
      `).join("");
    }

    async function deleteAssignment(date, name) {
      if (!confirm(`${date}의 ${name} 관리자 배정을 삭제할까요?`)) return;

      const res = await fetch("/api/subadmin/assignments/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          grade: selectedGrade,
          classNo: selectedClassNo,
          password: subAdminPassword,
          date,
          name
        })
      });

      const data = await res.json();
      alert(data.message);

      if (res.ok) {
        await loadDashboard();
      }
    }

    async function deleteReservation(date, name) {
      if (!confirm(`${date}의 ${name} 예약을 삭제할까요?`)) return;

      const res = await fetch("/api/subadmin/reservations/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          grade: selectedGrade,
          classNo: selectedClassNo,
          password: subAdminPassword,
          date,
          name
        })
      });

      const data = await res.json();
      alert(data.message);

      if (res.ok) {
        await loadDashboard();
      }
    }

    function updateSelectedAssignDates() {
      const dates = Array.from(selectedAssignDates).sort();

      if (!dates.length) {
        selectedAssignDatesBox.textContent = "선택한 날짜가 없습니다.";
        return;
      }

      selectedAssignDatesBox.innerHTML = dates.map(date => `<div>${date}</div>`).join("");
    }

    async function renderAssignCalendar() {
      if (!selectedGrade || !selectedClassNo) return;

      const year = assignCurrentDate.getFullYear();
      const month = assignCurrentDate.getMonth() + 1;

      assignMonthTitle.textContent = `${year}년 ${month}월`;

      const res = await fetch(`/api/reservations?grade=${selectedGrade}&classNo=${selectedClassNo}&year=${year}&month=${month}`);
      const data = await res.json();
      const holidays = data.holidays || {};

      assignCalendar.innerHTML = "";

      const days = ["일", "월", "화", "수", "목", "금", "토"];
      days.forEach(day => {
        const header = document.createElement("div");
        header.className = "day-header";
        header.textContent = day;
        assignCalendar.appendChild(header);
      });

      const firstDay = new Date(year, month - 1, 1);
      const lastDate = new Date(year, month, 0).getDate();
      const startDay = firstDay.getDay();

      for (let i = 0; i < startDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day-cell empty-cell";
        assignCalendar.appendChild(empty);
      }

      for (let day = 1; day <= lastDate; day++) {
        const dateObj = new Date(year, month - 1, day);
        const dateStr = formatDate(dateObj);
        const dayOfWeek = dateObj.getDay();
        const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
        const isHoliday = Boolean(holidays[dateStr]);
        const isBlocked = isWeekend || isHoliday;
        const isSelected = selectedAssignDates.has(dateStr);

        const cell = document.createElement("div");
        cell.classList.add("day-cell");

        if (isBlocked) {
          cell.classList.add("holiday-cell");
        } else if (isSelected) {
          cell.classList.add("partial-cell");
        } else {
          cell.classList.add("available-cell");
        }

        cell.innerHTML = `
          <div class="day-number">${day}</div>
          <div class="day-status">${isBlocked ? (holidays[dateStr] || "주말") : (isSelected ? "선택됨" : "선택 가능")}</div>
        `;

        if (!isBlocked) {
          cell.addEventListener("click", () => {
            if (selectedAssignDates.has(dateStr)) {
              selectedAssignDates.delete(dateStr);
            } else {
              selectedAssignDates.add(dateStr);
            }
            updateSelectedAssignDates();
            renderAssignCalendar();
          });
        }

        assignCalendar.appendChild(cell);
      }
    }

    loadClasses();
  </script>
</body>
</html>
